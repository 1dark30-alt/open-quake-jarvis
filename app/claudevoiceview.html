<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Claude Code</title>
<style>
  * { box-sizing: border-box; }
  :root { --bg:#05080d; --fg:#e8eef6; --muted:#9fb3c8; --dim:#7e93ab; --surf:#131f2c; --surf2:#0e1822;
    --tile-bd:#233245; --accent:#7CFFB2; --danger:#ff5a5a; --warn:#ffb454; }
  body.light { --bg:#e6ecf3; --fg:#12202c; --muted:#566573; --dim:#68798a; --surf:#f3f6f9; --surf2:#e6ecf2; --tile-bd:#c7d2dc; }
  html, body { margin: 0; width: 100%; height: 100%; }
  body { background: var(--bg); color: var(--fg); overflow: hidden;
    font-family: "Segoe UI", system-ui, sans-serif; }
  #wrap { display: flex; flex-direction: column; width: 100vw; height: 100vh; padding: 14px 24px 16px; gap: 10px; }

  /* Header: title | project (secondary) | status. user-select:none only on chrome, never on the
     transcript itself -- real cursor text selection must keep working there (a hard requirement). */
  #hdr { flex: 0 0 auto; display: flex; align-items: baseline; gap: 14px; user-select: none; }
  #title { font-size: 22px; font-weight: 700; }
  #project { font-size: 14px; color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status { font-size: 13px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; }
  #status.thinking, #status.listening { color: var(--accent); }
  #status.error { color: var(--danger); }
  #status.approval { color: var(--warn); }

  #card { flex: 1; min-height: 0; overflow-y: auto; background: var(--surf); border: 1px solid var(--tile-bd);
    border-radius: 14px; padding: 14px 18px; display: flex; flex-direction: column; gap: 14px; }
  .empty { color: var(--dim); font-size: 18px; text-align: center; margin: auto; }

  .msg .who { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 4px; user-select: none; }
  .msg.user .who { text-align: right; }
  .msg.user { align-self: flex-end; max-width: 85%; }
  .msg.assistant { align-self: flex-start; max-width: 90%; }
  .bubble { background: var(--surf2); border: 1px solid var(--tile-bd); border-radius: 12px; padding: 12px 16px;
    font-size: 16px; line-height: 1.45; overflow-wrap: break-word; }
  .msg.user .bubble { background: var(--accent); color: #04120b; border-color: transparent; }

  .codeblock { position: relative; margin: 8px 0; }
  .codeblock pre { margin: 0; background: var(--bg); border: 1px solid var(--tile-bd); border-radius: 8px;
    padding: 10px 12px; overflow-x: auto; font: 14px/1.4 "Cascadia Code", Consolas, monospace; }
  .copybtn { position: absolute; top: 6px; right: 6px; min-width: 48px; min-height: 44px; padding: 4px 10px;
    font-size: 12px; border-radius: 6px; border: 1px solid var(--tile-bd); background: var(--surf);
    color: var(--muted); cursor: pointer; user-select: none; }
  .copybtn:active { background: var(--accent); color: #04120b; }
  .copybtn.copied { color: var(--accent); border-color: var(--accent); }

  #inputrow { flex: 0 0 auto; display: flex; gap: 10px; }
  #textInput { flex: 1; min-height: 48px; padding: 10px 14px; font-size: 16px; border-radius: 10px;
    border: 1px solid var(--tile-bd); background: var(--surf2); color: var(--fg); resize: none;
    font-family: inherit; }
  #textInput:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #sendBtn { flex: 0 0 auto; min-width: 88px; min-height: 48px; border-radius: 10px; border: none;
    background: var(--accent); color: #04120b; font-size: 16px; font-weight: 700; cursor: pointer; user-select: none; }
  #sendBtn:disabled { opacity: .5; cursor: default; }
  #ttsTestBtn { flex: 0 0 auto; min-width: 48px; min-height: 48px; border-radius: 10px; border: 1px solid var(--tile-bd);
    background: var(--surf2); color: var(--fg); font-size: 14px; cursor: pointer; user-select: none; }
  #err { flex: 0 0 auto; font-size: 13px; color: var(--danger); min-height: 16px; user-select: none; }

  /* Approval overlay (Phase 7) -- the single highest-stakes tap in the app, so both buttons are well
     past the 48px minimum and the full command is always shown, never truncated. */
  #approvalOverlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex;
    align-items: center; justify-content: center; padding: 24px; z-index: 50; user-select: none; }
  #approvalOverlay.hidden { display: none; }
  #approvalCard { width: min(640px, 100%); max-height: 80vh; overflow-y: auto; background: var(--surf);
    border: 1px solid var(--warn); border-radius: 16px; padding: 20px 24px; box-shadow: 0 12px 40px rgba(0,0,0,.4); }
  #approvalTitle { font-size: 18px; font-weight: 700; color: var(--warn); margin-bottom: 10px; }
  #approvalTool { font-size: 14px; font-weight: 600; color: var(--muted); text-transform: uppercase;
    letter-spacing: .04em; margin-bottom: 8px; }
  #approvalDetail .approvalCode { margin: 0 0 10px; background: var(--bg); border: 1px solid var(--tile-bd);
    border-radius: 8px; padding: 10px 12px; overflow-x: auto; font: 14px/1.4 "Cascadia Code", Consolas, monospace;
    white-space: pre-wrap; word-break: break-word; user-select: text; }
  #approvalDetail .approvalPath { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  #approvalBtns { display: flex; gap: 14px; margin-top: 12px; }
  #approvalDeny, #approvalApprove { flex: 1; min-height: 64px; border-radius: 12px; border: none;
    font-size: 18px; font-weight: 700; cursor: pointer; }
  #approvalDeny { background: var(--surf2); color: var(--danger); border: 2px solid var(--danger); }
  #approvalApprove { background: var(--accent); color: #04120b; }
</style>
</head>
<body>
  <div id="wrap">
    <div id="hdr">
      <div id="title">Claude Code</div>
      <div id="project"></div>
      <div id="status">IDLE</div>
    </div>
    <div id="card"><div id="empty" class="empty">No conversation yet — type or tap the knob to start.</div><div id="list"></div></div>
    <div id="err"></div>
    <div id="inputrow">
      <textarea id="textInput" placeholder="Type a message…" rows="1"></textarea>
      <button id="sendBtn">➤ Send</button>
      <button id="ttsTestBtn" type="button" title="Phase 4 test: speak Claude's last reply">🔊 Test speech</button>
    </div>
  </div>
  <div id="approvalOverlay" class="hidden">
    <div id="approvalCard">
      <div id="approvalTitle">⚠ Claude wants to do something</div>
      <div id="approvalTool"></div>
      <div id="approvalDetail"></div>
      <div id="approvalBtns">
        <button id="approvalDeny" type="button">✕ Deny</button>
        <button id="approvalApprove" type="button">✓ Approve</button>
      </div>
    </div>
  </div>
  <script src="claudevoice-vad.js"></script>
  <script src="claudevoiceview.js"></script>
</body>
</html>
