<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>GitHub</title>
  <link rel="stylesheet" href="github.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.11.79-.25.79-.56v-2.24c-3.22.7-3.9-1.36-3.9-1.36-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.04 1.77 2.72 1.26 3.38.96.1-.75.4-1.26.74-1.55-2.57-.29-5.27-1.28-5.27-5.69 0-1.26.45-2.28 1.19-3.08-.12-.29-.52-1.46.11-3.04 0 0 .97-.31 3.16 1.18A11 11 0 0 1 12 6.13a11 11 0 0 1 2.88.39c2.19-1.49 3.16-1.18 3.16-1.18.63 1.58.23 2.75.11 3.04.74.8 1.19 1.82 1.19 3.08 0 4.42-2.71 5.39-5.29 5.68.42.36.79 1.06.79 2.14v3.27c0 .31.21.68.8.56A11.5 11.5 0 0 0 12 .7Z"/></svg></span>
        <span><strong>GitHub</strong><small>Operations</small></span>
      </div>
      <div class="context"><button id="repositoryButton" class="repository-button" type="button" disabled><span><small>Repository</small><strong id="repositoryLabel">Choose repository</strong></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 9 5 5 5-5"/></svg></button><span class="branch-chip"><small>Branch</small><strong id="branchLabel">—</strong></span></div>
      <div class="top-actions">
        <span id="connectionState" class="connection muted"><span class="dot"></span>Disconnected</span>
        <button id="refreshButton" class="icon-button" type="button" aria-label="Refresh"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7"/></svg></button>
      </div>
    </header>
    <main id="content" class="content" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="GitHub views">
      <button type="button" data-view="overview" class="selected"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg><span>Overview</span></button>
      <button type="button" data-view="pulls"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="5" r="2"/><circle cx="18" cy="19" r="2"/><path d="M6 7v10a2 2 0 0 0 2 2h3M18 17V9a4 4 0 0 0-4-4h-3m0 0 3-3m-3 3 3 3"/></svg><span>Pull Requests</span></button>
      <button type="button" data-view="actions"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4Z"/></svg><span>Actions</span></button>
      <button type="button" id="openButton"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6m0-6-9 9M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg><span>Open in GitHub</span></button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <div id="confirmOverlay" class="overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <h2 id="confirmTitle">Confirm action</h2><p id="confirmMessage"></p>
      <div class="dialog-actions"><button id="confirmCancel" type="button">Cancel</button><button id="confirmAccept" type="button" class="danger">Confirm</button></div>
    </div>
  </div>
  <div id="repositoryOverlay" class="overlay" hidden>
    <div class="dialog repository-dialog" role="dialog" aria-modal="true" aria-labelledby="repositoryTitle">
      <div class="repository-dialog-title"><h2 id="repositoryTitle">Choose a repository</h2><button id="repositoryRefresh" class="compact-button" type="button">↻ Refresh</button><button id="repositoryClose" class="compact-button" type="button">Close</button></div>
      <input id="repositorySearch" class="repository-search" type="search" placeholder="Search repositories…" autocomplete="off">
      <div id="repositoryList" class="repository-list"></div>
    </div>
  </div>
  <div id="commitOverlay" class="overlay" hidden>
    <div class="dialog commit-dialog" role="dialog" aria-modal="true" aria-labelledby="commitTitle">
      <div class="dialog-heading"><h2 id="commitTitle">Latest commit</h2><button id="commitClose" class="compact-button" type="button">Close</button></div>
      <div id="commitDetail" class="commit-detail"></div>
      <div class="dialog-actions"><button id="commitOpen" type="button">Open Commit in GitHub</button></div>
    </div>
  </div>
  <div id="dispatchOverlay" class="overlay" hidden>
    <form id="dispatchForm" class="dialog dispatch-dialog" aria-labelledby="dispatchTitle">
      <div class="dialog-heading"><div><h2 id="dispatchTitle">Run workflow</h2><p id="dispatchRef"></p></div><button id="dispatchClose" class="compact-button" type="button">Close</button></div>
      <div id="dispatchFields" class="dispatch-fields"></div>
      <div class="dialog-actions"><button id="dispatchCancel" type="button">Cancel</button><button id="dispatchAccept" type="submit">Run Workflow</button></div>
    </form>
  </div>
  <script src="githubPanelState.js"></script>
  <script src="github.js"></script>
</body>
</html>
