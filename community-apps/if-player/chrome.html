<!-- Panel chrome injected into Parchment's own page by vendor-parchment.js. Parchment's #gameport
     stays the story area; this adds the context strip, command and voice rails, and story picker. -->
<div id="ifctx">
  <span class="dot" id="statusdot"></span>
  <span id="statustext">Loading&hellip;</span>
  <span id="storyname"></span>
  <span id="spacer"></span>
  <span id="heard" class="heard"></span>
</div>

<section id="ifcommands" aria-label="Common commands">
  <div class="command-compass" aria-label="Movement commands">
    <button class="command-btn north" type="button" tabindex="-1" data-command="north" aria-label="Go north" disabled>N</button>
    <button class="command-btn up" type="button" tabindex="-1" data-command="up" aria-label="Go up" disabled>U</button>
    <button class="command-btn west" type="button" tabindex="-1" data-command="west" aria-label="Go west" disabled>W</button>
    <button class="command-btn look" type="button" tabindex="-1" data-command="look" disabled>Look</button>
    <button class="command-btn east" type="button" tabindex="-1" data-command="east" aria-label="Go east" disabled>E</button>
    <button class="command-btn south" type="button" tabindex="-1" data-command="south" aria-label="Go south" disabled>S</button>
    <button class="command-btn down" type="button" tabindex="-1" data-command="down" aria-label="Go down" disabled>D</button>
  </div>
  <div class="command-quick" aria-label="Frequent actions">
    <button class="command-btn" type="button" tabindex="-1" data-command="take all" disabled>Take all</button>
    <button class="command-btn" type="button" tabindex="-1" data-command="inventory" disabled>Inventory</button>
    <button class="command-btn" type="button" tabindex="-1" data-command="again" disabled>Again</button>
    <button class="command-btn" type="button" tabindex="-1" data-command="wait" disabled>Wait</button>
  </div>
</section>

<div id="ifrail">
  <button id="librarybtn" class="rbtn quiet" type="button" tabindex="-1">
    <span class="lb">Stories</span><span class="sub">Choose another</span>
  </button>
  <button id="speakbtn" class="rbtn" type="button" tabindex="-1">
    <span class="lb">Narration</span><span class="sub" id="speaksub">Off</span>
  </button>
  <button id="listenbtn" class="rbtn" type="button" tabindex="-1">
    <span class="lb">Listen</span><span class="sub" id="listensub">Off</span>
  </button>
  <button id="stopbtn" class="rbtn quiet" type="button" tabindex="-1">
    <span class="lb">Hush</span><span class="sub">Stop reading</span>
  </button>
  <button class="rbtn quiet" type="button" tabindex="-1" data-command="save"><span class="lb">Save</span></button>
  <button class="rbtn quiet" type="button" tabindex="-1" data-command="restore"><span class="lb">Restore</span></button>
  <div id="railnote" class="railnote"></div>
</div>

<div id="picker" hidden>
  <div class="pk-head">Choose a story</div>
  <div class="pk-sub" id="pickerhint"></div>
  <div id="storylist"></div>
  <div class="pk-folder" id="pkfolder"></div>
</div>
