<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unraid Manager</title>
  <link rel="stylesheet" href="style.css?v=1.0.1">
</head>
<body>
  <main class="shell">
    <nav class="rail" id="rail" aria-label="Servers"></nav>

    <section class="main">
      <header class="topbar">
        <div class="tabs" id="tabs" role="tablist"></div>
        <div class="chips" id="chips"></div>
      </header>
      <div class="view" id="view"></div>
    </section>
  </main>

  <div class="overlay" id="overlay" hidden>
    <div class="scrim" id="scrim"></div>
    <div class="panel" id="panel" role="dialog" aria-modal="true"></div>
  </div>

  <div class="overlay" id="confirm" hidden>
    <div class="scrim" id="confirm-scrim"></div>
    <div class="confirm-box" id="confirm-box" role="dialog" aria-modal="true"></div>
  </div>

  <script src="app.js?v=1.0.1"></script>
</body>
</html>
