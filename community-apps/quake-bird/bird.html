<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Quake Bird</title>
<style>
  /* Original artwork drawn in canvas -- no Flappy Bird assets (those are Dong Nguyen's).
     Theme (light/dark + accent) comes from the host via the #hash: _dark / _accent. */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05080d; }
  body { touch-action: manipulation; user-select: none; font-family: "Segoe UI", system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
(function () {
  // ---- host params (file:// page -> options arrive in the #hash) ----
  const p = {};
  location.hash.replace(/^#/, '').split('&').forEach(kv => {
    const i = kv.indexOf('='); if (i > 0) p[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1));
  });
  const DARK = p._dark !== '0';
  const ACCENT = /^#[0-9a-fA-F]{6}$/.test(p._accent || '') ? p._accent : '#7CFFB2';

  const cv = document.getElementById('c'), cx = cv.getContext('2d');
  let W = 0, H = 0, sky = null, scenery = [];
  function resize() {
    W = cv.width = Math.max(320, window.innerWidth);
    H = cv.height = Math.max(240, window.innerHeight);
    sky = cx.createLinearGradient(0, 0, 0, H);
    if (DARK) { sky.addColorStop(0, '#0d1a2e'); sky.addColorStop(1, '#05080d'); }
    else { sky.addColorStop(0, '#aed9f2'); sky.addColorStop(1, '#e8f4fb'); }
    // stars (dark) / clouds (light), parallax layer; fixed per resize so frames stay cheap
    scenery = [];
    for (let i = 0; i < (DARK ? 90 : 12); i++) {
      scenery.push({ x: Math.random() * W, y: Math.random() * (H - 120), s: DARK ? Math.random() * 1.6 + .4 : Math.random() * 30 + 22, v: Math.random() * 8 + 4 });
    }
  }
  window.addEventListener('resize', resize); resize();

  // ---- tuning (classic feel: ~480px-tall world, like the original's 512) ----
  const G = 1500, FLAP = -430, VMAX = 700;         // gravity px/s^2, flap impulse, terminal velocity
  const R = 15;                                    // bird collision radius
  const PIPE_W = 90, SPACING = 430, GROUND = 56;
  const gapFor = s => Math.max(150, 180 - s);      // gap shrinks 180 -> 150 as you score
  const speedFor = s => Math.min(380, 250 + 3 * s);

  // ---- state ----
  const ST = { READY: 0, PLAY: 1, DEAD: 2, PAUSE: 3, TAG: 4 };
  let state = ST.READY, bird, pipes, score, deadAt = 0, t0 = null, wing = 0;
  let best = 0, muted = false, tag = '';
  try { const s = JSON.parse(localStorage.getItem('quakebird') || '{}'); best = s.best || 0; muted = !!s.muted; tag = (s.tag || '').slice(0, 3); } catch (e) {}
  function persist() { try { localStorage.setItem('quakebird', JSON.stringify({ best, muted, tag })); } catch (e) {} }
  const muteRect = () => [W - 88, 16, 64, 64];   // on-screen mute toggle, top-right, 64px touch target

  // ---- shared high-score server (optional; see server/HANDOFF.md in kitten-cannon-remake) ----
  // Both endpoints are app options; clearing the URL plays offline. Every call degrades silently --
  // the game never blocks on the network.
  const GAME = 'quake-bird';
  const SERVER = (p.serverUrl || '').trim().replace(/\/+$/, '');
  const OPT_PLAYER = (p.playerName || '').trim().slice(0, 16).replace(/[^A-Za-z0-9_-]/g, '');
  const player = () => OPT_PLAYER || tag;   // app option overrides the initials entered in-game
  const net = { high: null, pct: null, personal: null, board: null };
  let lastFetch = 0;
  async function jget(url) { const r = await fetch(url); const j = await r.json(); if (!j || j.success !== true) throw new Error('api'); return j; }
  async function refreshNet(score) {
    if (!SERVER) return;
    const now = Date.now(); if (now - lastFetch < 2000) return; lastFetch = now;   // don't spam (HANDOFF asks ~1 per 2s)
    try {
      const hs = await jget(SERVER + '/get_high_score.php?game=' + GAME + (score != null ? '&score=' + score : ''));
      net.high = hs.highScore; net.pct = score != null ? hs.percentile : net.pct;
      const lb = await jget(SERVER + '/get_leaderboard.php?game=' + GAME + '&limit=5');
      net.board = Array.isArray(lb.leaderboard) ? lb.leaderboard : [];
      if (player()) {
        const pb = await jget(SERVER + '/get_personal_high_score.php?game=' + GAME + '&userId=' + encodeURIComponent(player()));
        net.personal = pb.personalHighScore;   // null when the player has no scores yet
      }
    } catch (e) {}
  }
  async function submitScore(s) {
    if (!SERVER || !player() || !(s > 0)) return;
    if (net.personal != null && s <= net.personal) { lastFetch = 0; refreshNet(s); return; }   // only PBs are worth saving
    try {
      const fd = new FormData(); fd.append('userId', player()); fd.append('score', s); fd.append('game', GAME);
      await fetch(SERVER + '/save_score.php', { method: 'POST', body: fd });
      if (net.personal == null || s > net.personal) net.personal = s;
    } catch (e) {}
    lastFetch = 0; refreshNet(s);   // fresh board + percentile for the game-over screen
  }
  refreshNet();
  function reset() {
    bird = { x: Math.min(W * .25, 480), y: H / 2, vy: 0 };
    pipes = []; score = 0;
  }
  reset();

  function spawnPipe(x) {
    const gap = gapFor(score);
    const c = 110 + gap / 2 + Math.random() * (H - GROUND - 220 - gap);   // gap center, clear of edges
    pipes.push({ x, top: c - gap / 2, bot: c + gap / 2, passed: false });
  }

  // ---- sound: tiny WebAudio blips, created on first input (autoplay policy) ----
  let ac = null;
  function beep(f0, f1, dur, vol) {
    if (muted) return;
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = 'square'; o.frequency.setValueAtTime(f0, t); o.frequency.linearRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur);
    } catch (e) {}
  }

  // ---- input: tap anywhere / Space / ArrowUp ----
  function tap() {
    if (state === ST.READY) { state = ST.PLAY; spawnPipe(W + 200); }
    else if (state === ST.PAUSE) { state = ST.PLAY; t0 = null; return; }
    else if (state === ST.DEAD) { if (performance.now() - deadAt > 500) { reset(); state = ST.READY; } return; }
    bird.vy = FLAP; wing = 1; beep(320, 480, .05, .06);
  }
  function toggleMute() { muted = !muted; persist(); beep(500, 650, .06, .06); }   // beep only audible when unmuting
  window.addEventListener('pointerdown', e => {
    e.preventDefault();
    const m = muteRect();   // a tap on the mute button must not flap the bird
    if (e.clientX >= m[0] - 8 && e.clientX <= m[0] + m[2] + 8 && e.clientY >= m[1] - 8 && e.clientY <= m[1] + m[3] + 8) { toggleMute(); return; }
    if (state === ST.TAG) { tagTap(e.clientX, e.clientY); return; }
    if (state === ST.READY && SERVER && !OPT_PLAYER) {   // READY-screen tag button (hidden when the app option pins the tag)
      const b = tagBtnRect();
      if (e.clientX >= b[0] && e.clientX <= b[0] + b[2] && e.clientY >= b[1] && e.clientY <= b[1] + b[3]) {
        tagEntry = tag; tagFrom = ST.READY; state = ST.TAG; return;
      }
    }
    tap();
  });
  window.addEventListener('keydown', e => {
    if (state === ST.TAG) {   // physical keyboard works too (desktop window)
      if (/^[a-zA-Z0-9]$/.test(e.key) && tagEntry.length < 3) tagEntry += e.key.toUpperCase();
      else if (e.code === 'Backspace') tagEntry = tagEntry.slice(0, -1);
      else if (e.code === 'Enter' && tagEntry) finishTag();
      return;
    }
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); tap(); }
    else if (e.code === 'KeyM') toggleMute();
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === ST.PLAY) state = ST.PAUSE; });

  function die() {
    deadAt = performance.now(); beep(180, 60, .22, .09);
    net.pct = null;   // percentile belongs to THIS run; cleared until the server answers for it
    if (score > best) { best = score; persist(); }
    // Arcade flow: a submittable score with no tag yet -> ask for initials first, then submit.
    if (SERVER && !player() && score > 0) { tagEntry = ''; tagFrom = ST.DEAD; state = ST.TAG; return; }
    state = ST.DEAD;
    submitScore(score);   // fire-and-forget; the game-over screen fills in as answers arrive
  }

  // ---- initials entry (arcade style, on-screen touch keys) ----
  let tagEntry = '', tagKeys = [], tagFrom = ST.DEAD;   // tagKeys: [x, y, w, h, label] rebuilt each draw for hit-testing
  const tagBtnRect = () => [24, H - 76, 280, 56];       // READY-screen "TAG" button, bottom-left
  function finishTag() {
    tag = tagEntry; persist(); beep(500, 700, .08, .06);
    if (tagFrom === ST.READY) { state = ST.READY; lastFetch = 0; refreshNet(); }   // re-pull personal best for the new tag
    else { state = ST.DEAD; submitScore(score); }
  }
  const TAG_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  function tagLayout() {
    tagKeys = [];
    const kw = 88, kh = 64, gap = 8, cols = 12;
    const gw = cols * kw + (cols - 1) * gap;
    const x0 = (W - gw) / 2, y0 = H / 2 - 40;
    TAG_CHARS.split('').forEach((ch, i) => {
      tagKeys.push([x0 + (i % cols) * (kw + gap), y0 + Math.floor(i / cols) * (kh + gap), kw, kh, ch]);
    });
    tagKeys.push([x0 + gw - 2 * kw - gap - (kw + gap) * 2, y0 + 3 * (kh + gap), kw * 2 + gap, kh, '⌫']);
    tagKeys.push([x0 + gw - 2 * kw - gap, y0 + 3 * (kh + gap), kw * 2 + gap, kh, 'OK']);
  }
  function tagTap(x, y) {
    for (const k of tagKeys) {
      if (x < k[0] || x > k[0] + k[2] || y < k[1] || y > k[1] + k[3]) continue;
      if (k[4] === '⌫') { tagEntry = tagEntry.slice(0, -1); beep(240, 200, .04, .05); }
      else if (k[4] === 'OK') { if (tagEntry) finishTag(); }
      else if (tagEntry.length < 3) { tagEntry += k[4]; beep(420, 520, .04, .05); }
      return;
    }
  }

  function step(dt) {
    wing = Math.max(0, wing - dt * 6);
    if (state !== ST.PLAY) {
      if (state === ST.READY) bird.y = H / 2 + Math.sin(performance.now() / 300) * 12;   // idle bob
      return;
    }
    bird.vy = Math.min(VMAX, bird.vy + G * dt);
    bird.y += bird.vy * dt;
    if (bird.y < R) { bird.y = R; bird.vy = 0; }                 // ceiling clamps (original: only pipes/ground kill)
    if (bird.y > H - GROUND - R) { bird.y = H - GROUND - R; die(); return; }

    const v = speedFor(score);
    pipes.forEach(pp => { pp.x -= v * dt; });
    if (!pipes.length || pipes[pipes.length - 1].x < W - SPACING) spawnPipe(W + PIPE_W);
    while (pipes.length && pipes[0].x < -PIPE_W - 10) pipes.shift();

    for (const pp of pipes) {
      if (!pp.passed && pp.x + PIPE_W / 2 < bird.x) { pp.passed = true; score++; beep(700, 900, .07, .06); }
      // circle vs the two pipe rects (closest-point test)
      for (const rect of [[pp.x, 0, PIPE_W, pp.top], [pp.x, pp.bot, PIPE_W, H - GROUND - pp.bot]]) {
        const nx = Math.max(rect[0], Math.min(bird.x, rect[0] + rect[2]));
        const ny = Math.max(rect[1], Math.min(bird.y, rect[1] + rect[3]));
        if ((bird.x - nx) ** 2 + (bird.y - ny) ** 2 < R * R) { die(); return; }
      }
    }
  }

  // ---- drawing (all original shapes) ----
  const PIPE_DARK = shade(ACCENT, DARK ? -.45 : -.35);
  function shade(hex, k) {
    const n = parseInt(hex.slice(1), 16), f = c => Math.max(0, Math.min(255, Math.round(c * (1 + k))));
    return 'rgb(' + f(n >> 16) + ',' + f((n >> 8) & 255) + ',' + f(n & 255) + ')';
  }
  function drawPipes() {
    for (const pp of pipes) {
      for (const seg of [[0, pp.top, true], [pp.bot, H - GROUND - pp.bot, false]]) {
        cx.fillStyle = ACCENT; cx.fillRect(pp.x, seg[0], PIPE_W, seg[1]);
        cx.fillStyle = PIPE_DARK;
        cx.fillRect(pp.x + PIPE_W - 14, seg[0], 14, seg[1]);                       // side shading
        const lipY = seg[2] ? seg[0] + seg[1] - 26 : seg[0];
        cx.fillRect(pp.x - 5, lipY, PIPE_W + 10, 26);                              // lip
        cx.fillStyle = ACCENT; cx.fillRect(pp.x - 5, lipY + 4, PIPE_W + 2, 18);
      }
    }
  }
  function drawBird() {
    const a = Math.max(-.45, Math.min(1.1, bird.vy / 600));                        // tilt with velocity
    cx.save(); cx.translate(bird.x, bird.y); cx.rotate(state === ST.PLAY || state === ST.DEAD ? a : 0);
    cx.fillStyle = '#f7c948'; cx.beginPath(); cx.arc(0, 0, 16, 0, 7); cx.fill();   // body
    cx.fillStyle = '#e8a530'; cx.beginPath(); cx.ellipse(-4, 3 - wing * 9, 9, 6, -.4, 0, 7); cx.fill();  // wing
    cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(7, -5, 5.5, 0, 7); cx.fill();    // eye
    cx.fillStyle = '#1b2430'; cx.beginPath(); cx.arc(8.5, -5, 2.6, 0, 7); cx.fill();
    cx.fillStyle = '#f0662f'; cx.beginPath(); cx.moveTo(12, 1); cx.lineTo(24, 4); cx.lineTo(12, 9); cx.fill();  // beak
    cx.restore();
  }
  function text(s, x, y, size, weight, align) {
    cx.font = (weight || 800) + ' ' + size + 'px "Segoe UI", system-ui, sans-serif';
    cx.textAlign = align || 'center';
    cx.lineWidth = Math.max(3, size / 9); cx.strokeStyle = DARK ? '#05080d' : '#ffffff';
    cx.strokeText(s, x, y); cx.fillStyle = DARK ? '#f2f5ff' : '#1b2430'; cx.fillText(s, x, y);
  }
  let groundX = 0;
  function draw(dt) {
    cx.fillStyle = sky; cx.fillRect(0, 0, W, H);
    cx.fillStyle = DARK ? 'rgba(240,245,255,.8)' : 'rgba(255,255,255,.85)';
    for (const s of scenery) {                                                    // stars / clouds drift
      if (state === ST.PLAY) { s.x -= s.v * dt; if (s.x < -60) s.x = W + 40; }
      if (DARK) cx.fillRect(s.x, s.y, s.s, s.s);
      else { cx.beginPath(); cx.ellipse(s.x, s.y, s.s, s.s * .55, 0, 0, 7); cx.fill(); }
    }
    drawPipes();
    // ground strip
    if (state === ST.PLAY) groundX = (groundX - speedFor(score) * dt) % 40;
    cx.fillStyle = DARK ? '#101826' : '#cfe4a6'; cx.fillRect(0, H - GROUND, W, GROUND);
    cx.fillStyle = DARK ? '#1a2740' : '#a9cd7c';
    for (let x = groundX; x < W; x += 40) { cx.save(); cx.translate(x, H - GROUND); cx.transform(1, 0, -.6, 1, 0, 0); cx.fillRect(0, 0, 20, 10); cx.restore(); }
    drawBird();
    const m = muteRect();   // mute toggle, always visible
    cx.fillStyle = DARK ? 'rgba(242,245,255,.10)' : 'rgba(20,28,46,.08)';
    cx.beginPath(); cx.roundRect(m[0], m[1], m[2], m[3], 16); cx.fill();
    cx.strokeStyle = DARK ? 'rgba(242,245,255,.25)' : 'rgba(20,28,46,.25)'; cx.lineWidth = 2; cx.stroke();
    cx.font = '30px "Segoe UI Emoji", "Segoe UI", sans-serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.fillStyle = DARK ? '#f2f5ff' : '#1b2430';
    cx.fillText(muted ? '🔇' : '🔊', m[0] + m[2] / 2, m[1] + m[3] / 2 + 2);   // 🔇 / 🔊
    cx.textBaseline = 'alphabetic';
    if (state === ST.PLAY || state === ST.PAUSE) text(score, W / 2, 84, 64);
    const dispBest = Math.max(best, net.personal || 0);   // device best merged with the server's personal best
    if (state === ST.READY) {
      text('QUAKE BIRD', W / 2, H / 2 - 90, 72);
      text('Tap to flap', W / 2, H / 2 + 76, 30, 700);
      const parts = [];
      if (dispBest) parts.push('Best  ' + dispBest);
      if (net.high != null) parts.push('Global  ' + net.high + (net.board && net.board[0] ? '  (' + net.board[0].userid + ')' : ''));
      if (parts.length) text(parts.join('      '), W / 2, H / 2 + 120, 22, 700);
      if (SERVER && !OPT_PLAYER) {   // initials button (hidden when the app option pins the tag)
        const b = tagBtnRect();
        cx.fillStyle = DARK ? 'rgba(242,245,255,.10)' : 'rgba(20,28,46,.08)';
        cx.beginPath(); cx.roundRect(b[0], b[1], b[2], b[3], 14); cx.fill();
        cx.strokeStyle = DARK ? 'rgba(242,245,255,.25)' : 'rgba(20,28,46,.25)'; cx.lineWidth = 2; cx.stroke();
        cx.font = '700 22px "Segoe UI", system-ui, sans-serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
        cx.fillStyle = DARK ? '#f2f5ff' : '#1b2430';
        cx.fillText(tag ? 'TAG  ' + tag : 'SET INITIALS', b[0] + b[2] / 2, b[1] + b[3] / 2 + 1);
        cx.textBaseline = 'alphabetic';
      }
    } else if (state === ST.DEAD) {
      text('GAME OVER', W / 2, H / 2 - 60, 60);
      text('Score  ' + score + '      Best  ' + dispBest, W / 2, H / 2 + 4, 34, 700);
      if (net.high != null && score >= net.high && score > 0) text('NEW GLOBAL BEST!', W / 2, H / 2 - 116, 30, 800);
      else if (net.pct != null) text('Beat ' + net.pct + '% of all flights', W / 2, H / 2 + 44, 22, 700);
      if (performance.now() - deadAt > 500) text('Tap to retry', W / 2, H / 2 + (net.pct != null ? 88 : 56), 26, 700);
      if (net.board && net.board.length) {   // top-5 board on the wide screen's right side
        const bx = Math.min(W - 260, W * .78), by = H / 2 - 92;
        text('TOP FLIGHTS', bx, by, 24);
        net.board.slice(0, 5).forEach((row, i) =>
          text(row.rank + '.  ' + row.userid + '   ' + row.score, bx, by + 42 + i * 34, 22, 700));
      }
    } else if (state === ST.PAUSE) {
      text('PAUSED', W / 2, H / 2 - 20, 48);
      text('Tap to resume', W / 2, H / 2 + 34, 26, 700);
    } else if (state === ST.TAG) {
      cx.fillStyle = DARK ? 'rgba(5,8,13,.72)' : 'rgba(255,255,255,.72)'; cx.fillRect(0, 0, W, H);
      text('ENTER YOUR INITIALS', W / 2, 74, 40);
      text('Score  ' + score, W / 2, 116, 22, 700);
      const slots = (tagEntry + '___').slice(0, 3).split('').join('  ');
      text(slots, W / 2, 172, 48);
      tagLayout();
      for (const k of tagKeys) {
        const ok = k[4] === 'OK';
        cx.fillStyle = ok ? ACCENT : (DARK ? 'rgba(242,245,255,.10)' : 'rgba(20,28,46,.08)');
        if (ok && !tagEntry) cx.fillStyle = DARK ? 'rgba(242,245,255,.05)' : 'rgba(20,28,46,.04)';   // OK disabled until a letter
        cx.beginPath(); cx.roundRect(k[0], k[1], k[2], k[3], 12); cx.fill();
        cx.strokeStyle = DARK ? 'rgba(242,245,255,.22)' : 'rgba(20,28,46,.22)'; cx.lineWidth = 1.5; cx.stroke();
        cx.font = '700 26px "Segoe UI", system-ui, sans-serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
        cx.fillStyle = ok && tagEntry ? '#06231a' : (DARK ? '#f2f5ff' : '#1b2430');
        cx.fillText(k[4], k[0] + k[2] / 2, k[1] + k[3] / 2 + 1);
      }
      cx.textBaseline = 'alphabetic';
    }
  }

  function loop(t) {
    if (t0 == null) t0 = t;
    const dt = Math.min(.032, (t - t0) / 1000); t0 = t;
    if (state !== ST.PAUSE) step(dt);
    draw(dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
